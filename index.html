<style>

.head h1{margin:0;font-size:19px;line-height:1.1}.head p{margin:0;font-size:12.5px;opacity:.8}
.head div:nth-child(2){flex:1}
.lang{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:5px 11px;cursor:pointer}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;cursor:pointer}
.modes button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}

.sum{font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;align-items:center}

.card{border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;margin-bottom:6px}

ol{margin:0;padding:0;list-style:none}

ol li i{font-style:normal;font-size:18px;color:var(--g)}ol li u{text-decoration:none;color:var(--mute);font-size:13px}

h2{font-size:15px;margin:2px 0}.note{color:var(--mute);font-size:12.5px;margin:0}
.nav-only{display:none;flex-direction:column;gap:10px}

.navmode .nav-only{display:flex}.navmode .hide-nav{display:none}.navmode #ui{bottom:auto}

#toast[hidden]{display:none}

.head h1 span{font-weight:400;opacity:.85}
#ui{transition:transform .25s}

.fab{position:fixed;z-index:1200;right:10px;top:84px;display:grid;gap:6px}
.fab button{width:38px;height:38px;border-radius:8px;border:0;background:var(--bg);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.35);cursor:pointer;font-size:18px}
body.closed #ui{transform:translateX(-104%)}body.closed #tog{left:12px}.navmode #tog{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink)}
.leaflet-popup-content{font-family:inherit;margin:12px 14px;min-width:170px}

 safe.length>2?fetch(CFG.overpass+'?data='+encodeURIComponent(ov)).then(r=>r.ok?r.json():{elements:[]}).then(j=>(j.elements||[]).map(x=>({lat:x.lat??x.center?.lat,lon:x.lon??x.center?.lon,name:x.tags?.['name:en']||x.tags?.name||'',display_name:[x.tags?.name,x.tags?.['addr:street'],x.tags?.['addr:city']].filter(Boolean).join(', '),type:x.tags?.amenity||x.tags?.shop||x.tags?.tourism||x.tags?.place||'',country:'bd'}))).catch(()=>[]):Promise.resolve([])
 ];
 if(CFG.barikoi.key)jobs.push(fetch(CFG.barikoi.url+'?api_key='+encodeURIComponent(CFG.barikoi.key)+'&bangla=true&q='+encodeURIComponent(q)).then(r=>r.ok?r.json():{}).then(j=>(j.places||[]).map(p=>({lat:+p.latitude,lon:+p.longitude,name:(bn()&&p.address_bn)||p.address||'',display_name:[p.address,p.area,p.city].filter(Boolean).join(', '),type:p.pType||'',country:'bd'}))).catch(()=>[]));
 const lists=await Promise.all(jobs),all=lists.flat().filter(p=>(p.name||p.display_name)&&Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)),seen=[],places=[];
 all.forEach(p=>{const ll=[+p.lat,+p.lon],key=String(p.name||p.display_name).toLowerCase().replace(/[^\\p{L}\\p{N}]+/gu,' ').trim();if(seen.some(x=>(x.key===key&&hav(x.ll,ll)<200)||hav(x.ll,ll)<25))return;seen.push({key,ll});places.push({...p,lat:ll[0],lon:ll[1],_d:hav(ctr,ll)})});
 const z=q.toLowerCase();places.sort((a,b)=>((a.country==='bd'?0:1)-(b.country==='bd'?0:1))||((String(a.name||a.display_name).toLowerCase().startsWith(z)?0:1)-(String(b.name||b.display_name).toLowerCase().startsWith(z)?0:1))||a._d-b._d);
 renderPlaces(places.slice(0,12),q,target)
}
function renderPlaces(places,q,target='dest'){
 $('#results').innerHTML=places.length?places.map((p,i)=>'<div class="res" data-i="'+i+'"><span>'+esc(p.display_name||p.name||q)+'<small>'+esc(p.type||p.class||'')+'</small></span><button data-pick="'+i+'">'+(target==='start'?t('from')+' ✓':target==='dest'?t('to')+' ✓':t('to'))+'</button></div>').join(''):'<p class="note">'+t('nores')+' <a href="https://www.google.com/maps/search/'+encodeURIComponent(q)+'" target="_blank" rel="noopener">Try Google Maps</a></p>';
 $('#results').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const p=places[+d.dataset.i],ll=[+p.lat,+p.lon],nm=p.name||String(p.display_name||q).split(',')[0];if(!Number.isFinite(ll[0])||!Number.isFinite(ll[1]))return;
 $('#results').innerHTML='';map.flyTo(ll,17);
 if(target==='start'){S.start=ll;S.startName=nm;$('#fromq').value=p.display_name||nm;pins();plan();navStatus()}
 else if(target==='dest'){S.dest=ll;S.destName=nm;$('#toq').value=p.display_name||nm;pins();plan();navStatus()}
 else {popup(ll,nm,p.display_name);setDest(ll,nm)}
 };
}
function navStatus(){const a=S.start?S.startName:'—',b=S.dest?S.destName:'—';$('#navstatus').textContent=t('from')+': '+a+' → '+t('to')+': '+b}

async function fetchRoutes(a,b){const r=await fetch(`${CFG.route[S.mode]}${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson&steps=true&alternatives=true`),j=await r.json();
 if(j.code!=='Ok')throw 0;return j.routes.map(R=>(R.ll=R.geometry.coordinates.map(c=>[c[1],c[0]]),R))}
async function plan(){const a=S.start||S.me;ui();if(!a||!S.dest)return;
 try{S.routes=await fetchRoutes(a,S.dest);S.sel=0;drawRoutes();ui();map.fitBounds(L.polyline(S.routes[0].ll).getBounds(),pad())}catch(e){S.routes=[];drawRoutes();ui();toast(t('fail'))}}
function setStart(ll,n){stopNav();S.start=ll;S.startName=n||t('pin');pins();plan()}
function setDest(ll,n){stopNav();S.dest=ll;S.destName=n||t('pin');pins();plan()}
function locate(){if(!navigator.geolocation)return toast(t('noloc'));navigator.geolocation.getCurrentPosition(p=>{S.me=[p.coords.latitude,p.coords.longitude];S.start=null;meMarker();pins();map.flyTo(S.me,15);plan()},()=>toast(t('noloc')),{enableHighAccuracy:true,timeout:10000})}
function popup(ll,name,addr){S.pop={ll,name};L.popup().setLatLng(ll).setContent(`<b>${esc(name)}</b><div style="color:#5e726b;font-size:12px;margin:2px 0 8px">${esc(addr||'')}</div><button class="btn pri" style="padding:8px;font-size:14px" onclick="popGo()">${t('here')}</button><button class="btn" style="margin-top:6px;width:100%" onclick="popFrom()">${t('fromhere')}</button>`).openOn(map)}
function popGo(){map.closePopup();setDest(S.pop.ll,S.pop.name)}
function popFrom(){map.closePopup();setStart(S.pop.ll,S.pop.name)}
map.on('click',async e=>{if(S.nav)return;const ll=[e.latlng.lat,e.latlng.lng];popup(ll,t('pin'),ll.map(v=>v.toFixed(4)).join(', '));
 try{const r=await fetch(`${CFG.reverse}?format=jsonv2&zoom=18&accept-language=bn,en&lat=${ll[0]}&lon=${ll[1]}`),j=await r.json();
  if(j.display_name&&S.pop&&S.pop.ll===ll){const q=j.display_name.split(',');popup(ll,j.name||q[0],q.slice(1,4).join(','))}}catch(x){}});
// ---------- Directions text ----------
const DIR={en:{left:'Turn left','slight left':'Bear left','sharp left':'Turn sharp left',right:'Turn right','slight right':'Bear right','sharp right':'Turn sharp right',straight:'Continue straight',uturn:'Make a U-turn'},
bn:{left:'বামে ঘুরুন','slight left':'একটু বামে যান','sharp left':'তীক্ষ্ণ বামে ঘুরুন',right:'ডানে ঘুরুন','slight right':'একটু ডানে যান','sharp right':'তীক্ষ্ণ ডানে ঘুরুন',straight:'সোজা যান',uturn:'ইউ-টার্ন নিন'}};
const GL={left:'↰','slight left':'↖','sharp left':'↰',right:'↱','slight right':'↗','sharp right':'↱',straight:'↑',uturn:'↶'};
function sTxt(s){const m=s.maneuver,ty=m.type,rd=s.name||'';
 if(ty==='arrive')return t('arrived');
 if(ty==='depart')return bn()?`${rd||'এখান'} থেকে যাত্রা শুরু করুন`:`Start${rd?' on '+rd:''}`;
 if(ty==='roundabout'||ty==='rotary')return bn()?`গোলচত্বরে ${num(m.exit||1)} নম্বর বহির্গমন নিন${rd?' — '+rd:''}`:`At the roundabout, take exit ${m.exit||1}${rd?' onto '+rd:''}`;
 const v=DIR[S.lang][m.modifier]||DIR[S.lang].straight;return bn()?(rd?`${v} — ${rd}`:v):(rd?`${v} onto ${rd}`:v)}
const glyph=s=>({arrive:'⚑',depart:'●',roundabout:'⟳',rotary:'⟳'}[s.maneuver.type]||GL[s.maneuver.modifier]||'↑');
// ---------- Panel ----------
function ui(){document.querySelectorAll('[data-i]').forEach(e=>{if(!e.dataset.i.match(/^\d+$/))e.textContent=t(e.dataset.i)});
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('#lang').textContent=bn()?'English':'বাংলা';document.documentElement.lang=S.lang;$('#navtoggle').textContent=t('planroute');$('#frombtn').textContent=t('find');$('#tobtn').textContent=t('find');$('#fromq').placeholder=t('fromsearch');$('#toq').placeholder=t('tosearch');$('#vc').textContent=(S.voice?'🔊 ':'🔇 ')+t('voice');
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
 const a=S.start?S.startName:S.me?t('me').slice(2):'—';
 $('#sum').innerHTML=S.dest||S.start?`<span>${t('from')}: <b>${esc(a)}</b> → ${t('to')}: <b>${esc(S.destName||'—')}</b></span><span><button class="btn" id="swp">⇅</button> <button class="btn" id="clr">✕</button></span>`:`<span>${t('pick')}</span>`;
 const R=S.routes[S.sel];$('#go').disabled=!R;$('#demo').style.display=R?'':'none';
 $('#routes').innerHTML=S.routes.map((r,i)=>`<div class="card${i===S.sel?' sel':''}" data-r="${i}"><em>${t(i?'alt':'fast')}</em><b>${fT(r.duration)}</b> · ${fD(r.distance)}</div>`).join('');
 $('#steps').innerHTML=R?R.legs[0].steps.map(s=>`<li><i>${glyph(s)}</i><span>${esc(sTxt(s))}</span><u>${s.distance?fD(s.distance):''}</u></li>`).join(''):''}
$('#sum').onclick=e=>{const id=e.target.id;
 if(id==='swp'){const a=S.start||S.me,n=S.start?S.startName:t('me').slice(2);S.start=S.dest;S.startName=S.destName;S.dest=a;S.destName=n;pins();plan()}
 if(id==='clr'){S.start=S.dest=null;S.routes=[];LR.clearLayers();pins();ui()}};
$('#routes').onclick=e=>{const c=e.target.closest('[data-r]');if(c){S.sel=+c.dataset.r;drawRoutes();ui()}};
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m){S.mode=m;plan()}};
$('#sbtn').onclick=()=>search('map');$('#q').onkeydown=e=>{if(e.key==='Enter')search('map')};
$('#frombtn').onclick=()=>search('start');$('#fromq').onkeydown=e=>{if(e.key==='Enter')search('start')};
$('#tobtn').onclick=()=>search('dest');$('#toq').onkeydown=e=>{if(e.key==='Enter')search('dest')};
$('#navtoggle').onclick=()=>{const box=$('#navbox');box.hidden=!box.hidden;$('#navtoggle').classList.toggle('on',!box.hidden);if(!box.hidden){$('#fromq').value=S.startName||'';$('#toq').value=S.destName||'';navStatus()}};

$('#me').onclick=locate;$('#go').onclick=()=>startNav(false);$('#demo').onclick=()=>startNav(true);$('#stop').onclick=()=>stopNav();
$('#vc').onclick=()=>{S.voice=!S.voice;if(!S.voice)try{speechSynthesis.cancel()}catch(e){}ui()};
$('#lang').onclick=()=>{S.lang=bn()?'en':'bn';ui();if(S.nav&&!S.nav.done)onPos(S.me)};
// ---------- Navigation ----------
const cum=l=>l.reduce((a,p,i)=>(a.push(i?a[i-1]+hav(l[i-1],p):0),a),[]);
function at(n,d){const c=n.cum,l=n.line;if(d>=c[c.length-1])return l[l.length-1];let j=0;while(c[j+1]<=d)j++;const f=(d-c[j])/(c[j+1]-c[j]||1);return[l[j][0]+(l[j+1][0]-l[j][0])*f,l[j][1]+(l[j+1][1]-l[j][1])*f]}
function startNav(sim){const R=S.routes[S.sel];if(!R)return;
 if(!sim&&!navigator.geolocation)return toast(t('noloc'));
 const n=S.nav={R,steps:R.legs[0].steps,line:R.ll,i:0,said:-1,rr:0,sim};
 document.body.classList.add('navmode');$('#banner').hidden=false;map.invalidateSize();lock();say(sTxt(n.steps[0]));
 if(sim){n.cum=cum(n.line);n.d=0;n.tm=setInterval(()=>onPos(at(n,n.d+=18)),200)}
 else n.w=navigator.geolocation.watchPosition(p=>onPos([p.coords.latitude,p.coords.longitude]),()=>toast(t('noloc')),{enableHighAccuracy:true,maximumAge:1000})}
function onPos(p){const n=S.nav;if(!n||n.done||!p)return;S.me=p;meMarker();map.setView(p,Math.max(map.getZoom(),17),{animate:false});
 const st=n.steps;let nx,dn;
 for(;;){nx=st[n.i+1];if(!nx)return arrive();dn=hav(p,[nx.maneuver.location[1],nx.maneuver.location[0]]);if(dn<35){n.i++;n.said=-1}else break}
 if(!n.sim&&distToLine(p,n.line)>80&&Date.now()-n.rr>8000){n.rr=Date.now();return reroute(p)}
 const left=dn+st.slice(n.i+1).reduce((q,s)=>q+s.distance,0);
 $('#bg').textContent=glyph(nx);$('#bd').textContent=fD(dn);$('#bt').textContent=sTxt(nx);$('#br').textContent=fT(n.R.duration*left/n.R.distance)+' · '+fD(left);
 if(dn<250&&n.said!==n.i){n.said=n.i;say((bn()?fD(dn)+' পর: ':'In '+fD(dn)+': ')+sTxt(nx))}}
async function reroute(p){toast(t('rerouting'));try{const rs=await fetchRoutes(p,S.dest),n=S.nav;if(!n)return;S.routes=rs;S.sel=0;Object.assign(n,{R:rs[0],steps:rs[0].legs[0].steps,line:rs[0].ll,i:0,said:-1});drawRoutes();say(t('rerouting'))}catch(e){}}
function arrive(){const n=S.nav;n.done=true;clearInterval(n.tm);if(n.w!=null)navigator.geolocation.clearWatch(n.w);
 $('#bg').textContent='⚑';$('#bd').textContent=S.destName;$('#bt').textContent=t('arrived');$('#br').textContent='';say(t('arrived'))}
function stopNav(){const n=S.nav;if(!n)return;clearInterval(n.tm);if(n.w!=null)navigator.geolocation.clearWatch(n.w);try{speechSynthesis.cancel()}catch(e){}try{wl&&wl.release()}catch(e){}
 S.nav=null;document.body.classList.remove('navmode');$('#banner').hidden=true;map.invalidateSize();if(S.routes[0])map.fitBounds(L.polyline(S.routes[S.sel].ll).getBounds(),pad())}
$('#tog').onclick=()=>document.body.classList.toggle('closed');
let sat=false;$('#lyr').onclick=()=>setLayer(ORD[(ORD.indexOf(cur)+1)%ORD.length]);setLayer(ORD[0]);
$('#loc').onclick=locate;
ui();
</script>
