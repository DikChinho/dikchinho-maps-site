<style>
:root{--g:#123b32;--gold:#f2b134;--bg:#fff;--ink:#14231f;--mute:#5e726b;--line:#dbe5e1;--chip:#e8f0ed;--bad:#d2402f}

html,body{height:100%;margin:0}
body{font:15px/1.45 "Hind Siliguri",system-ui,sans-serif;color:var(--ink);background:var(--g)}
button,input{font:inherit;color:inherit}
#map{position:fixed;inset:0}
#ui{position:fixed;z-index:1100;left:0;top:0;bottom:0;width:380px;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 24px rgba(0,0,0,.3)}
.head{background:var(--g);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:none}
.head h1{margin:0;font-size:19px;line-height:1.1}.head p{margin:0;font-size:12.5px;opacity:.8}
.head div:nth-child(2){flex:1}
.lang{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:5px 11px;cursor:pointer}
.body{overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--chip);font-weight:600}
.pri{background:var(--gold);color:var(--g);font-weight:700;font-size:16px;padding:13px;width:100%}
.pri:disabled{opacity:.4;cursor:default}.danger{background:var(--bad);color:#fff}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;cursor:pointer}
.modes button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.res{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.res span{flex:1;font-size:14px}.res small{display:block;color:var(--mute);font-size:12px}
.res button{background:var(--chip);border:0;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px}
.sum{font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;align-items:center}
.sum b{color:var(--ink)}
.card{border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;margin-bottom:6px}
.card.sel{border:2px solid var(--g);padding:8px 11px}
.card em{font-style:normal;display:block;font-size:12px;color:var(--mute)}.card b{font-size:18px}
ol{margin:0;padding:0;list-style:none}
ol li{display:grid;grid-template-columns:28px 1fr auto;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ol li i{font-style:normal;font-size:18px;color:var(--g)}ol li u{text-decoration:none;color:var(--mute);font-size:13px}
@media(prefers-color-scheme:dark){ol li i,.modes button.on{color:var(--gold)}.modes button.on{background:#1f5a4b}}
h2{font-size:15px;margin:2px 0}.note{color:var(--mute);font-size:12.5px;margin:0}
.nav-only{display:none;flex-direction:column;gap:10px}
#navbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}#navbox[hidden]{display:none}#navtoggle.on{background:var(--g);color:#fff}
.navmode .nav-only{display:flex}.navmode .hide-nav{display:none}.navmode #ui{bottom:auto}
#banner{position:fixed;z-index:1200;left:392px;right:60px;top:12px;background:var(--g);color:#fff;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#banner[hidden]{display:none}
#bg{font-size:40px;line-height:1;text-align:center;color:var(--gold)}#bd{font-size:26px;font-weight:700;line-height:1.1}#bt{font-size:15px}
#br{grid-column:1/3;font-size:13px;opacity:.85;border-top:1px solid rgba(255,255,255,.25);padding-top:6px}
#toast{position:fixed;z-index:1300;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;max-width:80%;text-align:center;font-size:14px}
#toast[hidden]{display:none}
@media(max-width:760px){#ui{top:auto;right:0;width:auto;max-height:42vh;border-radius:16px 16px 0 0}.navmode #ui{max-height:30vh}#banner{left:10px}.head{padding-top:12px}}
.head h1 span{font-weight:400;opacity:.85}
#ui{transition:transform .25s}
#tog{position:fixed;z-index:1200;left:392px;top:12px;width:40px;height:40px;border-radius:10px;border:0;background:var(--bg);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;font-size:18px;transition:left .25s}
.fab{position:fixed;z-index:1200;right:10px;top:84px;display:grid;gap:6px}
.fab button{width:38px;height:38px;border-radius:8px;border:0;background:var(--bg);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.35);cursor:pointer;font-size:18px}
body.closed #ui{transform:translateX(-104%)}body.closed #tog{left:12px}.navmode #tog{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink)}
.leaflet-popup-content{font-family:inherit;margin:12px 14px;min-width:170px}
@media(max-width:760px){#tog,body.closed #tog{left:10px}body.closed #ui{transform:translateY(104%)}}

#tog{left:438px;top:16px;width:42px;height:42px;border-radius:12px}
.fab{right:14px;top:70px;gap:8px}

#bd{font-size:27px;letter-spacing:-.7px}
#bt{font-size:14px}

@media(max-width:760px){

const buildingLayer=L.layerGroup().addTo(map);let buildingTimer=null,buildingBusy=false,lastBuildingBox='';
async function loadBuildings(){if(map.getZoom()<16){buildingLayer.clearLayers();lastBuildingBox='';return}if(buildingBusy)return;const b=map.getBounds(),box=[b.getSouth().toFixed(4),b.getWest().toFixed(4),b.getNorth().toFixed(4),b.getEast().toFixed(4)].join(',');if(box===lastBuildingBox)return;buildingBusy=true;try{const q='[out:json][timeout:10];way[building]('+box+');out geom;';const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),11000);const r=await fetch(CFG.overpass,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},signal:ctl.signal});clearTimeout(timer);if(!r.ok)throw Error('building data unavailable');const j=await r.json();if(map.getZoom()<16)return;const fresh=L.layerGroup();for(const el of (j.elements||[])){if(!el.geometry||el.geometry.length<3)continue;const pts=el.geometry.map(p=>[p.lat,p.lon]);const tags=el.tags||{};L.polygon(pts,{color:'#718d81',weight:1,opacity:.8,fillColor:'#b9cfc0',fillOpacity:.45}).bindPopup('<b>'+esc(tags.name||tags['name:en']||tags['name:bn']||'Building')+'</b>'+(tags['addr:street']?'<br>'+esc(tags['addr:street']):'')+(tags.building?'<br><small>'+esc(tags.building)+'</small>':'')).addTo(fresh)}buildingLayer.clearLayers();fresh.addTo(buildingLayer);lastBuildingBox=box}catch(e){/* Keep the street map usable if the public building-data service is busy. */}finally{buildingBusy=false}}
function scheduleBuildings(){clearTimeout(buildingTimer);buildingTimer=setTimeout(loadBuildings,500)}
map.on('moveend zoomend',scheduleBuildings);
const pad=()=>innerWidth>760?{paddingTopLeft:[400,70],paddingBottomRight:[50,50]}:{paddingTopLeft:[24,90],paddingBottomRight:[24,Math.round(innerHeight*.5)]};
const dot=(ll,c,r=9)=>L.circleMarker(ll,{radius:r,color:'#fff',weight:3,fillColor:c,fillOpacity:1}).addTo(LP);
function meMarker(){if(!S.me)return;if(meM)meM.setLatLng(S.me);else meM=L.circleMarker(S.me,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map)}
function pins(){LP.clearLayers();if(S.start)dot(S.start,'#2fa36b');if(S.dest)dot(S.dest,'#d2402f')}
function drawRoutes(){LR.clearLayers();
 S.routes.forEach((R,i)=>{if(i!==S.sel)L.polyline(R.ll,{color:'#7b8fa8',weight:7,opacity:.85,dashArray:'8 8'}).on('click',()=>{S.sel=i;drawRoutes();ui()}).addTo(LR)});
 const R=S.routes[S.sel];if(R){L.polyline(R.ll,{color:'#fff',weight:12}).addTo(LR);L.polyline(R.ll,{color:'#0f7ea8',weight:7}).addTo(LR)}}
// ---------- Search & routing ----------
let searchTarget='dest',searchSeq=0,autoSearchTimers={start:null,dest:null};
async function search(target='dest'){
 searchTarget=target;
 const seq=++searchSeq;
 const input=target==='start'?'#fromq':'#toq';
 const q=$(input).value.trim();if(!q)return;
 const center=map.getCenter(),ctr=[center.lat,center.lng];
 const cm=q.match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
 if(cm){let a=+cm[1],b=+cm[2];if(a>40)[a,b]=[b,a];renderPlaces([{lat:a,lon:b,name:t('pin'),display_name:a.toFixed(5)+', '+b.toFixed(5),type:'coordinates',country:'bd'}],q,target);return}
 $('#results').innerHTML='<p class="note">'+(T[S.lang].loading||'Searching Bangladesh…')+'</p>';
 const box='88.0,26.7,93.0,20.5';
 const queries=[q];
 if(q.includes(',')){const parts=q.split(',').map(x=>x.trim()).filter(Boolean);if(parts.length>1)queries.push(parts.slice(0,-1).join(' '));}
 const nominatim=await Promise.all([...new Set(queries)].map(query=>fetch(CFG.search+'?format=jsonv2&limit=10&addressdetails=1&accept-language=bn,en&countrycodes=bd&viewbox='+box+'&bounded=0&q='+encodeURIComponent(query)).then(r=>r.ok?r.json():[]).catch(()=>[])));
 const photonPromise=fetch(CFG.photon+'?limit=20&lat=23.8583&lon=90.2667&q='+encodeURIComponent(q)).then(r=>r.ok?r.json():{features:[]}).then(j=>(j.features||[]).map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],name:f.properties.name||f.properties.street||'',display_name:[f.properties.name,f.properties.street,f.properties.district||f.properties.suburb,f.properties.city||f.properties.county,f.properties.state,f.properties.country].filter(Boolean).join(', '),type:f.properties.osm_value||'',country:String(f.properties.countrycode||'').toLowerCase()}))).catch(()=>[]);
 // Search named OSM buildings, shops, housing societies and landmarks as a third index.
 const overpassPromise=(async()=>{try{const safe=q.replace(/["\\()[\]{}.*+?^$|]/g,' ').slice(0,80);const query='[out:json][timeout:12];(nwr["name"~"'+safe+'",i](20.5,88,26.7,93););out center tags;';const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),13000);const resp=await fetch(CFG.overpass,{method:'POST',body:'data='+encodeURIComponent(query),headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},signal:ctl.signal});clearTimeout(timer);if(!resp.ok)return [];const data=await resp.json();return (data.elements||[]).map(el=>{const tags=el.tags||{},lat=el.lat??(el.center&&el.center.lat),lon=el.lon??(el.center&&el.center.lon);return {lat:lat,lon:lon,name:tags.name||tags['name:en']||tags['name:bn']||'',display_name:[tags.name||tags['name:en']||tags['name:bn'],tags['addr:suburb'],tags['addr:city']||tags['addr:district'],tags['addr:street'],tags['addr:housenumber'],'Bangladesh'].filter(Boolean).join(', '),type:tags.building?'building':tags.amenity||tags.shop||tags.office||tags.landuse||el.type,country:'bd'}}).filter(p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lon))}catch(e){return []}})();
 const [photon,overpass]=await Promise.all([photonPromise,overpassPromise]);
 const all=nominatim.flat().concat(photon,overpass).map(p=>({...p,country:String(p.country||p.address?.country_code||'').toLowerCase()})).filter(p=>(p.name||p.display_name)&&Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)&&+p.lat>=20.5&&+p.lat<=26.7&&+p.lon>=88&&+p.lon<=93);
 const norm=v=>String(v||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
 const z=norm(q),seen=[],places=[];
 for(const p of all){
  const ll=[+p.lat,+p.lon],name=norm(p.name),address=norm(p.display_name);
  if(seen.some(x=>(x.name===name&&hav(x.ll,ll)<250)||hav(x.ll,ll)<30))continue;
  seen.push({name,ll});
  const exact=name===z||address===z,starts=name.startsWith(z)||address.startsWith(z),contains=address.includes(z);
  const local=norm(q.split(',').slice(1).join(' '));
  const locality=local&&address.includes(local);
  const score=(exact?-10000:0)+(starts?-3000:0)+(contains?-1000:0)+(locality?-500:0)+(p.country==='bd'?-500:0)+Math.min(hav(ctr,ll)/1000,500);
  places.push({...p,lat:ll[0],lon:ll[1],_score:score});
 }
 places.sort((a,b)=>a._score-b._score);
 if(seq!==searchSeq)return;
 renderPlaces(places.slice(0,12),q,target);
}
function renderPlaces(places,q,target='dest'){
 const google='https://www.google.com/maps/search/'+encodeURIComponent(q+' Bangladesh');
 const osm='https://www.openstreetmap.org/search?query='+encodeURIComponent(q+' Bangladesh');
 const noResults='<div style="border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--chip);margin-bottom:8px"><b>We couldn’t match “'+esc(q)+'” to a verified map result.</b><p class="note" style="margin-top:6px">This does not necessarily mean the place does not exist. Small neighbourhoods, housing societies, local nicknames and new businesses may be missing from the map data.</p><p class="note"><b>Try these steps:</b><br>• Add the area, city or district (e.g. “Ambagan, Savar, Bangladesh”).<br>• Try a nearby road, mosque, school, market or landmark.<br>• Search with Bangla spelling or English spelling.<br>• Enter latitude, longitude (e.g. 23.8583, 90.2667), or tap the exact spot on the map.</p><div class="row" style="margin-top:8px"><button class="btn" data-retry="1" style="flex:1">Try with Bangladesh</button></div><p class="note" style="margin-top:8px">Compare external map indexes: <a href="'+google+'" target="_blank" rel="noopener">Google Maps</a> · <a href="'+osm+'" target="_blank" rel="noopener">OpenStreetMap</a></p></div>';
 $('#results').innerHTML=(places.length?places.map((p,i)=>'<div class="res" data-i="'+i+'"><span><b>'+esc(p.name||String(p.display_name||q).split(',')[0])+'</b><small>'+esc(p.display_name||'')+'</small></span><button data-pick="'+i+'">'+(target==='start'?t('from')+' ✓':t('to')+' ✓')+'</button></div>').join(''):noResults)+'<p class="note" style="padding:4px 2px">Map data is not complete everywhere. If you find the exact place in another map, copy its coordinates or tap that location here.</p>';
 $('#results').onclick=e=>{
  if(e.target.closest('[data-retry]')){const input=target==='start'?'#fromq':'#toq';$(input).value=q+', Bangladesh';search(target);return}
  const d=e.target.closest('[data-i]');if(!d)return;
  const p=places[+d.dataset.i],ll=[+p.lat,+p.lon],nm=p.name||String(p.display_name||q).split(',')[0];
  if(!Number.isFinite(ll[0])||!Number.isFinite(ll[1]))return;
  $('#results').innerHTML='';
  const kind=String(p.type||p.class||p.addresstype||'').toLowerCase();
  const zoom=/city|town|village|district|county|state|administrative/.test(kind)?14:18;
  map.flyTo(ll,zoom,{duration:0.8});
  if(target==='start'){S.start=ll;S.startName=nm;$('#fromq').value=p.display_name||nm;pins();plan();navStatus()}
  else {S.dest=ll;S.destName=nm;$('#toq').value=p.display_name||nm;pins();plan();navStatus()}
 };
}
function navStatus(){const a=S.start?S.startName:'—',b=S.dest?S.destName:'—';$('#navstatus').textContent=t('from')+': '+a+' → '+t('to')+': '+b}

async function fetchRoutes(a,b){const r=await fetch(`${CFG.route[S.mode]}${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson&steps=true&alternatives=true`),j=await r.json();
 if(j.code!=='Ok')throw 0;return j.routes.map(R=>(R.ll=R.geometry.coordinates.map(c=>[c[1],c[0]]),R))}
async function plan(){const a=S.start||S.me;ui();if(!a||!S.dest)return;
 try{S.routes=await fetchRoutes(a,S.dest);S.sel=0;drawRoutes();ui();map.fitBounds(L.polyline(S.routes[0].ll).getBounds(),pad())}catch(e){S.routes=[];drawRoutes();ui();toast(t('fail'))}}
async function routeFromCurrentLocation(){if(!S.dest)return toast(t('pick'));if(S.start||S.me){await plan();return}if(!navigator.geolocation)return toast(t('noloc'));toast(bn()?'রুট তৈরি করতে আপনার অবস্থানের অনুমতি দিন':'Allow location access to calculate a route');navigator.geolocation.getCurrentPosition(async p=>{S.me=[p.coords.latitude,p.coords.longitude];meMarker();await plan();if(S.routes.length)startNav(false)},()=>toast(t('noloc')),{enableHighAccuracy:true,timeout:15000,maximumAge:10000})}
function setStart(ll,n){stopNav();S.start=ll;S.startName=n||t('pin');pins();plan()}
function setDest(ll,n){stopNav();S.dest=ll;S.destName=n||t('pin');pins();plan()}
function locate(){if(!navigator.geolocation)return toast(t('noloc'));navigator.geolocation.getCurrentPosition(p=>{S.me=[p.coords.latitude,p.coords.longitude];S.start=null;meMarker();pins();map.flyTo(S.me,15);plan()},()=>toast(t('noloc')),{enableHighAccuracy:true,timeout:10000})}
function popup(ll,name,addr){S.pop={ll,name};L.popup().setLatLng(ll).setContent(`<b>${esc(name)}</b><div style="color:#5e726b;font-size:12px;margin:2px 0 8px">${esc(addr||'')}</div><button class="btn pri" style="padding:8px;font-size:14px" onclick="popGo()">${t('here')}</button><button class="btn" style="margin-top:6px;width:100%" onclick="popFrom()">${t('fromhere')}</button>`).openOn(map)}
function popGo(){map.closePopup();setDest(S.pop.ll,S.pop.name)}
function popFrom(){map.closePopup();setStart(S.pop.ll,S.pop.name)}
map.on('click',async e=>{if(S.nav)return;const ll=[e.latlng.lat,e.latlng.lng];popup(ll,t('pin'),ll.map(v=>v.toFixed(4)).join(', '));
 try{const r=await fetch(`${CFG.reverse}?format=jsonv2&zoom=18&accept-language=bn,en&lat=${ll[0]}&lon=${ll[1]}`),j=await r.json();
  if(j.display_name&&S.pop&&S.pop.ll===ll){const q=j.display_name.split(',');popup(ll,j.name||q[0],q.slice(1,4).join(','))}}catch(x){}});
// ---------- Directions text ----------
const DIR={en:{left:'Turn left','slight left':'Bear left','sharp left':'Turn sharp left',right:'Turn right','slight right':'Bear right','sharp right':'Turn sharp right',straight:'Continue straight',uturn:'Make a U-turn'},
bn:{left:'বামে ঘুরুন','slight left':'একটু বামে যান','sharp left':'তীক্ষ্ণ বামে ঘুরুন',right:'ডানে ঘুরুন','slight right':'একটু ডানে যান','sharp right':'তীক্ষ্ণ ডানে ঘুরুন',straight:'সোজা যান',uturn:'ইউ-টার্ন নিন'}};
const GL={left:'↰','slight left':'↖','sharp left':'↰',right:'↱','slight right':'↗','sharp right':'↱',straight:'↑',uturn:'↶'};
function sTxt(s){const m=s.maneuver,ty=m.type,rd=s.name||'';
 if(ty==='arrive')return t('arrived');
 if(ty==='depart')return bn()?`${rd||'এখান'} থেকে যাত্রা শুরু করুন`:`Start${rd?' on '+rd:''}`;
 if(ty==='roundabout'||ty==='rotary')return bn()?`গোলচত্বরে ${num(m.exit||1)} নম্বর বহির্গমন নিন${rd?' — '+rd:''}`:`At the roundabout, take exit ${m.exit||1}${rd?' onto '+rd:''}`;
 const v=DIR[S.lang][m.modifier]||DIR[S.lang].straight;return bn()?(rd?`${v} — ${rd}`:v):(rd?`${v} onto ${rd}`:v)}
const glyph=s=>({arrive:'⚑',depart:'●',roundabout:'⟳',rotary:'⟳'}[s.maneuver.type]||GL[s.maneuver.modifier]||'↑');
// ---------- Panel ----------
function ui(){document.querySelectorAll('[data-i]').forEach(e=>{if(!e.dataset.i.match(/^\d+$/))e.textContent=t(e.dataset.i)});
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('#lang').textContent=bn()?'English':'বাংলা';document.documentElement.lang=S.lang;$('#theme').textContent=S.dark?'☀':'◐';document.body.classList.toggle('dark',S.dark);$('#navtoggle').textContent=t('planroute');$('#frombtn').textContent=t('find');$('#tobtn').textContent=t('find');$('#fromq').placeholder=t('fromsearch');$('#toq').placeholder=t('tosearch');$('#vc').textContent=(S.voice?'🔊 ':'🔇 ')+t('voice');
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
 const a=S.start?S.startName:S.me?t('me').slice(2):'—';
 $('#sum').innerHTML=S.dest||S.start?`<span>${t('from')}: <b>${esc(a)}</b> → ${t('to')}: <b>${esc(S.destName||'—')}</b></span><span><button class="btn" id="swp">⇅</button> <button class="btn" id="clr">✕</button></span>`:`<span>${t('pick')}</span>`;
 const R=S.routes[S.sel];$('#go').disabled=!S.dest;$('#demo').style.display=R?'':'none';
 $('#routes').innerHTML=S.routes.map((r,i)=>`<div class="card${i===S.sel?' sel':''}" data-r="${i}"><em>${t(i?'alt':'fast')}</em><b>${fT(r.duration)}</b> · ${fD(r.distance)}</div>`).join('');
 $('#steps').innerHTML=R?R.legs[0].steps.map(s=>`<li><i>${glyph(s)}</i><span>${esc(sTxt(s))}</span><u>${s.distance?fD(s.distance):''}</u></li>`).join(''):''}
$('#sum').onclick=e=>{const id=e.target.id;
 if(id==='swp'){const a=S.start||S.me,n=S.start?S.startName:t('me').slice(2);S.start=S.dest;S.startName=S.destName;S.dest=a;S.destName=n;pins();plan()}
 if(id==='clr'){S.start=S.dest=null;S.routes=[];LR.clearLayers();pins();ui()}};
$('#routes').onclick=e=>{const c=e.target.closest('[data-r]');if(c){S.sel=+c.dataset.r;drawRoutes();ui()}};
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m){S.mode=m;plan()}};
$('#frombtn').onclick=()=>search('start');$('#fromq').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(autoSearchTimers.start);search('start')}};
$('#tobtn').onclick=()=>search('dest');$('#toq').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(autoSearchTimers.dest);search('dest')}};
// Live suggestions: search after a short pause while typing, without requiring the Find button.
$('#fromq').addEventListener('input',()=>{clearTimeout(autoSearchTimers.start);const q=$('#fromq').value.trim();if(q.length<3){if(searchTarget==='start')$('#results').innerHTML='';return}autoSearchTimers.start=setTimeout(()=>search('start'),450)});
$('#toq').addEventListener('input',()=>{clearTimeout(autoSearchTimers.dest);const q=$('#toq').value.trim();if(q.length<3){if(searchTarget==='dest')$('#results').innerHTML='';return}autoSearchTimers.dest=setTimeout(()=>search('dest'),450)});
$('#fromq').value=S.startName||'';$('#toq').value=S.destName||'';navStatus();

$('#theme').onclick=()=>{S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);$('#theme').textContent=S.dark?'☀':'◐'};
$('#me').onclick=locate;$('#go').onclick=()=>startNav(false);$('#demo').onclick=()=>startNav(true);$('#stop').onclick=()=>stopNav();
$('#vc').onclick=()=>{S.voice=!S.voice;if(!S.voice)try{speechSynthesis.cancel()}catch(e){}ui()};
$('#lang').onclick=()=>{S.lang=bn()?'en':'bn';ui();if(S.nav&&!S.nav.done)onPos(S.me)};
// ---------- Navigation ----------
const cum=l=>l.reduce((a,p,i)=>(a.push(i?a[i-1]+hav(l[i-1],p):0),a),[]);
function at(n,d){const c=n.cum,l=n.line;if(d>=c[c.length-1])return l[l.length-1];let j=0;while(c[j+1]<=d)j++;const f=(d-c[j])/(c[j+1]-c[j]||1);return[l[j][0]+(l[j+1][0]-l[j][0])*f,l[j][1]+(l[j+1][1]-l[j][1])*f]}
function startNav(sim){const R=S.routes[S.sel];if(!R){if(!sim)routeFromCurrentLocation();else toast(t('pick'));return}
 if(!sim&&!navigator.geolocation)return toast(t('noloc'));
 const n=S.nav={R,steps:R.legs[0].steps,line:R.ll,i:0,said:-1,rr:0,sim};
 document.body.classList.add('navmode');$('#banner').hidden=false;map.invalidateSize();lock();say(sTxt(n.steps[0]));
 if(sim){n.cum=cum(n.line);n.d=0;n.tm=setInterval(()=>onPos(at(n,n.d+=18)),200)}
 else n.w=navigator.geolocation.watchPosition(p=>onPos([p.coords.latitude,p.coords.longitude]),()=>toast(t('noloc')),{enableHighAccuracy:true,maximumAge:1000})}
function onPos(p){const n=S.nav;if(!n||n.done||!p)return;S.me=p;meMarker();map.setView(p,Math.max(map.getZoom(),17),{animate:false});
 const st=n.steps;let nx,dn;
 for(;;){nx=st[n.i+1];if(!nx)return arrive();dn=hav(p,[nx.maneuver.location[1],nx.maneuver.location[0]]);if(dn<35){n.i++;n.said=-1}else break}
 if(!n.sim&&distToLine(p,n.line)>80&&Date.now()-n.rr>8000){n.rr=Date.now();return reroute(p)}
 const left=dn+st.slice(n.i+1).reduce((q,s)=>q+s.distance,0);
 $('#bg').textContent=glyph(nx);$('#bd').textContent=fD(dn);$('#bt').textContent=sTxt(nx);$('#br').textContent=fT(n.R.duration*left/n.R.distance)+' · '+fD(left);
 if(dn<250&&n.said!==n.i){n.said=n.i;say((bn()?fD(dn)+' পর: ':'In '+fD(dn)+': ')+sTxt(nx))}}
async function reroute(p){toast(t('rerouting'));try{const rs=await fetchRoutes(p,S.dest),n=S.nav;if(!n)return;S.routes=rs;S.sel=0;Object.assign(n,{R:rs[0],steps:rs[0].legs[0].steps,line:rs[0].ll,i:0,said:-1});drawRoutes();say(t('rerouting'))}catch(e){}}
function arrive(){const n=S.nav;n.done=true;clearInterval(n.tm);if(n.w!=null)navigator.geolocation.clearWatch(n.w);
 $('#bg').textContent='⚑';$('#bd').textContent=S.destName;$('#bt').textContent=t('arrived');$('#br').textContent='';say(t('arrived'))}
function stopNav(){const n=S.nav;if(!n)return;clearInterval(n.tm);if(n.w!=null)navigator.geolocation.clearWatch(n.w);try{speechSynthesis.cancel()}catch(e){}try{wl&&wl.release()}catch(e){}
 S.nav=null;document.body.classList.remove('navmode');$('#banner').hidden=true;map.invalidateSize();if(S.routes[0])map.fitBounds(L.polyline(S.routes[S.sel].ll).getBounds(),pad())}
$('#tog').onclick=()=>document.body.classList.toggle('closed');
$('#lyr').onclick=()=>setLayer(cur==='osm'?'sat':'osm');setLayer('osm');
$('#loc').onclick=locate;
ui();
</script>
